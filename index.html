<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel &amp; Miles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&family=Roboto+Slab:wght@700;900&display=swap">
<style>
/* Layout: one phone-width column, magazine structure (hairlines, numbered sections), fixed tab bar.
   Deliberately light-only: the approved mockup palette, every color set explicitly. */
:root {
  --page: #f5f4f1;      /* Hilltop page white */
  --card: #ffffff;
  --ink: #1c1c1c;       /* Press ink */
  --slate: #5c5248;     /* secondary text */
  --stone: #c8c2ba;     /* hairlines */
  --rule: #ece8e2;      /* faint row dividers */
  --track: #e4dfd8;     /* ring track */
  --blue: #0f79e8;      /* food: fills, ring, bars, big numbers */
  --blue-text: #0b6bcf; /* food: small text, labeled buttons */
  --lime: #629d13;      /* exercise: big numbers */
  --lime-text: #4d7c0f; /* exercise: small text, labeled buttons */
  --lime-light: #a8e05f;/* exercise on dark panels */
  --font-display: "Roboto Slab", Georgia, serif;
  --font-label: "Oswald", "Arial Narrow", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
.app.no-nav { padding-bottom: 24px; }
.gutter { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* Type roles */
.eyebrow { font-family: var(--font-label); font-weight: 700; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--slate); }
.label { font-family: var(--font-label); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); }
.h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 30px; line-height: 1.1; text-wrap: balance; }
.h2 { margin: 0; font-family: var(--font-label); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--slate); }
.num { font-family: var(--font-display); font-weight: 900; font-variant-numeric: tabular-nums; }
.muted { color: var(--slate); font-size: 13px; }

/* Header */
.top { padding-block: 24px 16px; border-bottom: 2px solid var(--ink); display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top .titles { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.iconbtn { width: 44px; height: 44px; flex: none; border: 1px solid var(--stone); background: var(--card); border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; }
.iconbtn:disabled { opacity: 0.35; cursor: default; }
.iconbtn svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rowtop { display: flex; align-items: center; gap: 12px; }

/* Content stack */
.stack { display: flex; flex-direction: column; gap: 16px; padding-block: 20px; }
.card { background: var(--card); border: 1px solid var(--stone); border-radius: 2px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--stone); }
.card-head h2 { margin: 0; font-family: var(--font-label); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; }
.card-head .num { font-size: 16px; font-weight: 700; }
.item { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--rule); }
.item .what { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item .name { font-weight: 500; overflow-wrap: anywhere; }
.item .kcal { font-variant-numeric: tabular-nums; }
.item .kcal.ex { font-weight: 600; }
.del { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; color: var(--slate); }
.del svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; fill: none; }
.addlink { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 0; background: transparent; font-family: var(--font-label); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue-text); text-align: left; }
.addlink.ex { color: var(--lime-text); }
.addlink svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; fill: none; }
.pill-ex { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: #ffffff; background: var(--lime-text); padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }

/* Ring + strip */
.ringwrap { display: flex; flex-direction: column; align-items: center; gap: 20px; padding-block: 24px 4px; }
.ring { position: relative; width: 210px; height: 210px; }
.ring svg { display: block; }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ring .big { font-size: 46px; line-height: 1; color: var(--blue); }
.ring .big.over { color: var(--ink); }
.strip { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.strip > div { padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; border-right: 1px solid var(--stone); }
.strip > div:last-child { border-right: 0; }
.strip .num { font-size: 22px; }

/* Banners and notes */
.note { background: var(--card); border: 1px dashed var(--stone); border-radius: 2px; padding: 12px 14px; font-size: 13px; color: var(--slate); line-height: 1.5; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--ink); color: #ffffff; border-radius: 2px; font-size: 13px; }
.banner button { border: 1px solid #ffffff; background: transparent; color: #ffffff; min-height: 36px; padding: 0 12px; border-radius: 2px; font-family: var(--font-label); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
.field input { height: 48px; padding: 0 12px; border: 1px solid var(--stone); border-radius: 2px; background: var(--card); font-size: 16px; font-weight: 400; width: 100%; min-width: 0; }
.field input:focus { border-color: var(--ink); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.seg { display: grid; border: 1px solid var(--stone); border-radius: 2px; background: var(--card); }
.seg button { min-height: 44px; border: 0; background: transparent; font-family: var(--font-label); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--blue-text); color: #ffffff; }
.choice { width: 100%; text-align: left; padding: 13px 15px; border: 1px solid var(--stone); border-radius: 2px; background: var(--card); display: flex; flex-direction: column; gap: 2px; }
.choice[aria-pressed="true"] { border: 2px solid var(--blue); padding: 12px 14px; }
.choice b { font-weight: 600; }
.section { display: flex; flex-direction: column; gap: 10px; }

/* Dark result panel (Hilltop ink panel with accent bar) */
.panel { background: var(--ink); color: #ffffff; border-radius: 2px; padding: 20px; display: flex; flex-direction: column; gap: 6px; border-top: 6px solid var(--lime-light); }
.panel .eyebrow, .panel .unit, .panel .sub { color: var(--stone); }
.panel .row { display: flex; align-items: baseline; gap: 8px; }
.panel .num { font-size: 52px; line-height: 1; color: var(--lime-light); }
.panel .unit { font-family: var(--font-label); font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.panel .sub { font-size: 13px; line-height: 1.5; }

/* Buttons */
.btn { min-height: 52px; width: 100%; border: 0; border-radius: 2px; font-family: var(--font-label); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: #ffffff; background: var(--blue-text); }
.btn.big { background: var(--blue); font-size: 19px; }
.btn.ex { background: var(--lime-text); }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--ink); }
.btn.danger { background: #a3262a; }
.linkbtn { border: 0; background: transparent; color: var(--blue-text); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 10px 0; }
.btnrow { display: flex; gap: 10px; }
.btnrow > * { flex: 1; }

/* Exercise chips + stepper */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--stone); background: var(--card); font-weight: 500; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--lime-text); border-color: var(--lime-text); color: #ffffff; font-weight: 600; }
.stepper { display: flex; align-items: center; border: 1px solid var(--ink); border-radius: 2px; background: var(--card); }
.stepper button { width: 52px; height: 52px; border: 0; background: transparent; font-size: 24px; }
.stepper input { width: 72px; height: 52px; border: 0; border-left: 1px solid var(--stone); border-right: 1px solid var(--stone); border-radius: 0; background: var(--card); text-align: center; font-size: 26px; -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets button { min-width: 44px; height: 44px; padding: 0 8px; border: 1px solid var(--stone); border-radius: 2px; background: var(--card); font-family: var(--font-label); font-weight: 700; font-size: 14px; }
.presets button[aria-pressed="true"] { border-color: var(--ink); }

/* History */
.avgs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.avgs > div { padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; border-right: 1px solid var(--stone); text-align: center; }
.avgs > div:last-child { border-right: 0; }
.avgs .num { font-size: 24px; }
.chart { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.bars { height: 160px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; border-bottom: 1px solid var(--ink); }
.bar { position: relative; height: 160px; }
.bar .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--blue); }
.bar .fill.partial { background: var(--card); border: 2px dashed var(--blue); }
.bar .budget { position: absolute; left: -3px; right: -3px; height: 2px; background: var(--ink); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--slate); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; background: var(--blue); display: inline-block; }
.sw.line { width: 14px; height: 2px; background: var(--ink); }
.weightrow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.weightrow .num { font-size: 34px; line-height: 1; }
.inline-form { display: flex; gap: 8px; }
.inline-form input { flex: 1; min-width: 0; height: 48px; padding: 0 12px; border: 1px solid var(--stone); border-radius: 2px; background: var(--card); font-size: 16px; }
.inline-form button { flex: none; width: auto; padding: 0 16px; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tabs button { min-height: 56px; border: 0; background: transparent; font-family: var(--font-label); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); }
.tabs button[aria-current="page"] { color: var(--blue-text); box-shadow: inset 0 3px 0 var(--blue); }

/* Add Food: tabs, search, results, picker, recent/favorites */
.what { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tabpills { display: flex; gap: 8px; flex-wrap: wrap; }
.tabpills button { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--stone); background: var(--card); font-family: var(--font-label); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.tabpills button[aria-selected="true"] { background: var(--blue-text); border-color: var(--blue-text); color: #ffffff; }
.searchrow { display: flex; gap: 8px; }
.searchbox { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; background: var(--card); border: 1px solid var(--ink); border-radius: 2px; }
.searchbox svg { width: 18px; height: 18px; flex: none; stroke: var(--slate); fill: none; stroke-width: 2; stroke-linecap: round; }
.searchbox input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; }
.searchbox:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; }
.scanbtn { width: 48px; height: 48px; flex: none; border: 0; border-radius: 2px; background: var(--blue); display: inline-flex; align-items: center; justify-content: center; }
.scanbtn svg { width: 22px; height: 22px; stroke: #ffffff; fill: none; stroke-width: 2; stroke-linecap: round; }
.result .rrow { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; }
.result .name { font-weight: 600; overflow-wrap: anywhere; }
.src { align-self: flex-start; margin-top: 4px; padding: 1px 8px; border: 1px solid var(--stone); border-radius: 999px; font-family: var(--font-label); font-weight: 500; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); }
.addbtn { width: 44px; height: 44px; flex: none; border: 1px solid var(--blue); border-radius: 2px; background: var(--card); color: var(--blue); display: inline-flex; align-items: center; justify-content: center; }
.addbtn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; fill: none; }
.picker { border-top: 1px solid var(--rule); background: #faf9f6; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.field select { height: 48px; padding: 0 10px; border: 1px solid var(--stone); border-radius: 2px; background: var(--card); font-size: 15px; font-weight: 400; width: 100%; min-width: 0; }
.pickrow { display: flex; align-items: center; gap: 8px; }
.pickrow .num { font-size: 22px; min-width: 84px; }
.starbtn { width: 44px; height: 44px; flex: none; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; }
.star { width: 20px; height: 20px; fill: none; stroke: var(--slate); stroke-width: 2; stroke-linejoin: round; }
.star.on { fill: var(--blue-text); stroke: var(--blue-text); }
.frow .item { padding-left: 4px; gap: 4px; }
.linkish { border: 0; background: transparent; text-align: left; padding: 4px 0; }
.added { min-width: 72px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-family: var(--font-label); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue-text); }
.added svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mealcard { padding: 14px 8px 14px 16px; display: flex; align-items: center; gap: 10px; }
.mealcard .what { gap: 4px; }
.mname { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.mealbtns { display: flex; align-items: center; gap: 2px; flex: none; }
.dashbtn { min-height: 44px; border: 1px dashed var(--blue-text); border-radius: 2px; background: transparent; color: var(--blue-text); font-family: var(--font-label); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; }
.dashbtn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; fill: none; }
.errmsg { margin: 0; color: #a3262a; font-size: 13px; }
.note .linkbtn { font-size: 13px; }
a { color: var(--blue-text); }

/* Saved meal logged as one line */
.group .grouptoggle .name { font-weight: 600; }
.chev { font-size: 11px; }
.subitems { list-style: none; margin: 0; padding: 0 52px 10px 28px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--slate); }
.subitems li { display: flex; justify-content: space-between; gap: 12px; }
.subitems li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.group.open > .item { border-bottom: 0; }

/* Barcode scanner overlay */
.scanner { position: fixed; inset: 0; z-index: 20; background: var(--ink); color: #ffffff; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.scanbox { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
.aim { position: absolute; left: 12%; right: 12%; top: 38%; height: 24%; border: 3px solid var(--lime-light); border-radius: 4px; }
.scanbar { padding-block: 16px 20px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.scanbar .sub { color: var(--stone); font-size: 13px; line-height: 1.5; }
.scanbar .inline-form input { color: var(--ink); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .ring circle.prog { transition: stroke-dasharray 300ms ease; }
}
</style>

<script>
'use strict';
/* ===== Data ===== */
const STORE_KEY = 'fuel-miles.v1';
const MEALS = [['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['dinner', 'Dinner'], ['snacks', 'Snacks']];
// MET values from the Compendium of Physical Activities (to re-verify before release)
const ACTIVITIES = [
  { id: 'walk', chip: 'Walking', name: 'Walking (3 mph)', met: 3.5 },
  { id: 'brisk', chip: 'Brisk walk', name: 'Brisk walk (3.5 mph)', met: 4.3 },
  { id: 'run-easy', chip: 'Run · easy', name: 'Running, easy (5 mph)', met: 8.3 },
  { id: 'run-mod', chip: 'Run · moderate', name: 'Running, moderate (6 mph)', met: 9.8 },
  { id: 'cycle', chip: 'Cycling', name: 'Cycling, leisure', met: 6.8 },
  { id: 'swim', chip: 'Swimming', name: 'Swimming laps', met: 5.8 },
  { id: 'weights', chip: 'Weights', name: 'Weight lifting', met: 6.0 },
  { id: 'hoops', chip: 'Basketball', name: 'Basketball', met: 6.0 },
  { id: 'hike', chip: 'Hiking', name: 'Hiking', met: 6.0 },
  { id: 'hiit', chip: 'HIIT', name: 'HIIT', met: 8.0 },
  { id: 'mow', chip: 'Mowing · push', name: 'Mowing, push mower', met: 6.0 }
];
const LEVELS = [
  { name: 'Mostly sitting', desc: 'Desk job, little walking', f: 1.2 },
  { name: 'Lightly active', desc: 'On your feet part of the day', f: 1.375 },
  { name: 'Active', desc: 'On your feet most of the day', f: 1.55 },
  { name: 'Very active', desc: 'Physical job or labor', f: 1.725 }
];
const GOALS = [['lose', 'Lose', -500], ['maintain', 'Maintain', 0], ['gain', 'Gain', 250]];
const MIN_TARGET = 1200;

let memoryCopy = null;
function normalize(d) {
  d.days = d.days || {}; d.weights = d.weights || []; d.favs = d.favs || []; d.meals = d.meals || []; d.foods = d.foods || {};
  d.apiKey = d.apiKey || '';
  return d;
}
function emptyData(keepKey) { return normalize({ profile: null, days: {}, weights: [], sample: false, apiKey: keepKey || '' }); }
function loadData() {
  try { const s = localStorage.getItem(STORE_KEY); if (s) return normalize(JSON.parse(s)); } catch (e) {}
  return memoryCopy || emptyData();
}
function saveData() {
  memoryCopy = S.data;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S.data)); } catch (e) {}
}

/* ===== Dates ===== */
function keyOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dateOf(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function shift(k, n) { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); }
function todayKey() { return keyOf(new Date()); }
function longDate(k) { return dateOf(k).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }).replace(',', ' ·'); }
function shortDate(k) { return dateOf(k).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function dayTitle(k) {
  const t = todayKey();
  if (k === t) return 'Today';
  if (k === shift(t, -1)) return 'Yesterday';
  return dateOf(k).toLocaleDateString('en-US', { weekday: 'long' });
}

/* ===== Math ===== */
const fmt = (n) => Math.round(n).toLocaleString('en-US');
function weightOn(k) {
  const ws = S.data.weights.filter((w) => w.date <= k).sort((a, b) => a.date < b.date ? -1 : 1);
  return ws.length ? ws[ws.length - 1].lb : S.data.profile.weightLb;
}
function bmrFor(p, lb) {

/* ===== Food sources: USDA FoodData Central (search) + Open Food Facts (barcodes) ===== */
const USDA = 'https://api.nal.usda.gov/fdc/v1';
const OZ = 28.3495;
function tc(s) { return s.toLowerCase().replace(/(^|[\s(\/-])([a-z])/g, (m, a, b) => a + b.toUpperCase()); }
function tidy(s) { s = String(s || '').trim(); return s && s === s.toUpperCase() ? tc(s) : s; }
function kcalFrom(list) {
  for (const [id, num] of [[1008, '208'], [2048, '958'], [2047, '957']]) {
    const n = list.find((x) => (x.nutrientId === id || x.nutrientNumber === num) && String(x.unitName || '').toUpperCase() === 'KCAL');
    if (n && n.value != null) return Number(n.value);
  }
  const kj = list.find((x) => x.nutrientId === 1062 || String(x.unitName || '').toUpperCase() === 'KJ');
  return kj && kj.value != null ? Number(kj.value) / 4.184 : null;
}
// US measures only: skip portion labels written in grams or milliliters
function isMetric(label) { return /\d\s*(g|gm|gram|grams|ml|milliliters?)\b/i.test(label) || /^\s*(g|ml)\b/i.test(label); }
// Words for matching: lowercase, no punctuation, simple plurals folded ("bananas" -> "banana")
function words(s) { return String(s).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(Boolean).map((w) => (w.length > 3 && w.endsWith('s') && !w.endsWith('ss') ? w.slice(0, -1) : w)); }
function matchScore(food, q) {
  const qw = words(q), nw = words(food.name);
  if (!qw.length) return 0;
  let s = 0;
  if (nw.join(' ') === qw.join(' ')) s += 100;
  if (nw[0] === qw[0]) s += 40;
  const missing = qw.filter((w) => !nw.includes(w)).length;
  s += missing ? -20 * missing : 25;
  s -= Math.max(0, nw.length - qw.length) * 3;
  if (nw.includes('raw')) s += 6;
  if (food.portions.length) s += 10;
  if (food.dataType === 'Survey (FNDDS)') s += 4;
  return s;
}
// Combine results only when clearly the same food: same cleaned-up name (and brand) and calories within 5%
function combineSame(list) {
  const out = [];
  list.forEach((f) => {
    const k = words(f.name).join(' ') + '|' + words(f.brand).join(' ');
    const twin = out.find((o) => o._k === k && Math.abs(o.kcal100 - f.kcal100) <= 0.05 * Math.max(o.kcal100, f.kcal100, 1));
    if (!twin) { f._k = k; out.push(f); return; }
    if (f.portions.length > twin.portions.length) { f._k = k; out[out.indexOf(twin)] = f; }
  });
  return out;
}
function rank(list, q) {
  return combineSame(list).map((f, i) => ({ f, i, s: matchScore(f, q) })).sort((a, b) => (b.s - a.s) || (a.i - b.i)).map((x) => x.f);
}
function dedupe(ps) { const seen = new Set(); return ps.filter((p) => { const k = p.label.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }); }
function parseUsda(f) {
  const kcal = kcalFrom(f.foodNutrients || []);
  if (kcal == null) return null;
  const branded = f.dataType === 'Branded';
  const portions = [];
  if (branded && f.servingSize > 0) {
    const u = String(f.servingSizeUnit || 'g').toLowerCase();
    const g = ['g', 'grm', 'ml', 'mlt'].includes(u) ? f.servingSize : u === 'oz' ? f.servingSize * OZ : null;
    const hh = f.householdServingFullText ? tidy(f.householdServingFullText) : '';
    if (g) portions.push({ label: hh && !isMetric(hh) ? hh : '1 serving', grams: g });
  }
  (f.foodMeasures || []).forEach((m) => {
    if (m.gramWeight > 0 && m.disseminationText && !/not specified/i.test(m.disseminationText) && !isMetric(m.disseminationText)) portions.push({ label: m.disseminationText, grams: m.gramWeight });
  });
  return {
    fkey: 'usda:' + f.fdcId, fdcId: f.fdcId, dataType: f.dataType, name: tidy(f.description) || 'Food',
    brand: branded ? tidy(f.brandName || f.brandOwner || '') : '', kcal100: kcal,
    portions: dedupe(portions).slice(0, 8), src: branded ? 'USDA · brand' : 'USDA', needsDetail: !branded && !portions.length
  };
}
function parseOff(code, p) {
  const n = p.nutriments || {};
  let k = n['energy-kcal_100g'];
  if (k == null && n['energy_100g'] != null) k = n['energy_100g'] / 4.184;
  if (k == null) return null;
  const portions = [];
  const sq = Number(p.serving_quantity);
  if (sq > 0) portions.push({ label: '1 serving', grams: sq });
  return { fkey: 'off:' + code, name: p.product_name || 'Scanned product', brand: String(p.brands || '').split(',')[0].trim(), kcal100: Number(k), portions, src: 'Open Food Facts' };
}
function unitsFor(food) {
  // Clean labels saved by earlier versions ("1 Cup (240 g)", "1 serving · 30 g") and drop metric-only ones
  const ps = food.portions.map((p) => ({ ...p, label: p.label.replace(/\s*\(\d+(\.\d+)?\s*g\)\s*$/i, '').replace(/\s*·.*$/, '') })).filter((p) => !isMetric(p.label));
  return ps.concat([{ label: 'oz', grams: OZ, unit: true }]);
}
async function usdaGet(path, params) {
  const qs = new URLSearchParams({ api_key: S.data.apiKey, ...params });
  const r = await fetch(USDA + path + '?' + qs.toString());
  if (r.status === 401 || r.status === 403) throw new Error('key');
  if (r.status === 429) throw new Error('limit');
  if (!r.ok) throw new Error('http:' + r.status);
  return r.json();
}
function errText(e) {
  if (e.message === 'key') return 'USDA didn’t accept the API key. Check it in Settings.';
  if (e.message === 'limit') return 'You’ve hit USDA’s hourly search limit. Recent and Favorites still work.';
  if (String(e.message).startsWith('http:')) return 'The food database returned an error (code ' + e.message.slice(5) + '). Try again in a moment.';
  return 'Couldn’t reach the food database (no response). Check your connection and try again.';
}
let searchSeq = 0, searchTimer = null;
async function runSearch(q) {
  q = q.trim();
  S.search.q = q;
  if (q.length < 2) { S.search = { ...S.search, status: 'idle', generic: [], branded: [], msg: '' }; renderResults(); return; }
  if (!S.data.apiKey) { renderResults(); return; }
  const seq = ++searchSeq;
  S.pick = null;
  S.search.status = 'loading'; S.search.msg = ''; renderResults();
  try {
    let gen, brand;
    try {
      const [g, b] = await Promise.all([
        usdaGet('/foods/search', { query: q, dataType: 'Survey (FNDDS),SR Legacy,Foundation', pageSize: '15' }),
        usdaGet('/foods/search', { query: q, dataType: 'Branded', pageSize: '10' })
      ]);
      gen = g.foods || []; brand = b.foods || [];
    } catch (e) {
      if (e.message === 'key' || e.message === 'limit') throw e;
      // Fallback: one plain search, split into everyday foods and brands here
      const all = (await usdaGet('/foods/search', { query: q, pageSize: '40' })).foods || [];
      gen = all.filter((f) => f.dataType !== 'Branded'); brand = all.filter((f) => f.dataType === 'Branded').slice(0, 12);
    }
    if (seq !== searchSeq) return;
    S.search.generic = rank(gen.map(parseUsda).filter(Boolean), q);
    S.search.branded = rank(brand.map(parseUsda).filter(Boolean), q);
    S.search.more = false;
    S.search.status = 'done';
  } catch (e) {
    if (seq !== searchSeq) return;
    S.search.status = 'error'; S.search.msg = errText(e);
  }
  renderResults();
}
async function loadDetail(food) {
  if (!food.needsDetail || !S.data.apiKey) return;
  try {
    const d = await usdaGet('/food/' + food.fdcId, {});
    (d.foodPortions || []).forEach((p) => {
      if (!(p.gramWeight > 0)) return;
      let label = p.portionDescription && !/not specified/i.test(p.portionDescription) ? p.portionDescription : '';
      if (!label) {
        const unit = p.measureUnit && p.measureUnit.name && p.measureUnit.name !== 'undetermined' ? p.measureUnit.name : '';
        label = [p.amount || 1, unit, p.modifier || ''].join(' ').replace(/\s+/g, ' ').trim();
      }
      if (label && !isMetric(label)) food.portions.push({ label, grams: p.gramWeight });
    });
    food.portions = dedupe(food.portions).slice(0, 8);
  } catch (e) {}
  food.needsDetail = false;
  if (S.pick && S.pick.food === food) { S.pick.u = 0; S.pick.qty = 1; refreshFoodArea(); }
}
async function lookupBarcode(code) {
  code = String(code).replace(/\D/g, '');
  if (code.length < 6) return;
  S.foodTab = 'search'; S.pick = null; S.manual = false;
  S.search = { ...S.search, status: 'loading', generic: [], branded: [], msg: '', scanned: code };
  render();
  let food = null;
  try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + code + '.json?fields=product_name,brands,nutriments,serving_size,serving_quantity');
    if (r.ok) { const j = await r.json(); if (j.status === 1 && j.product) food = parseOff(code, j.product); }
  } catch (e) {}
  if (!food && S.data.apiKey) {
    try {
      const j = await usdaGet('/foods/search', { query: code, dataType: 'Branded', pageSize: '5' });
      const strip = (s) => String(s || '').replace(/^0+/, '');
      const hit = (j.foods || []).find((f) => strip(f.gtinUpc) === strip(code));
      if (hit) food = parseUsda(hit);
    } catch (e) {}
  }
  if (food) { S.search.status = 'scanned'; S.pick = { food, u: 0, qty: 1 }; S.pickIn = 'search'; }
  else { S.search.status = 'error'; S.search.msg = 'Couldn’t find barcode ' + code + '. Try searching by name, or enter it yourself below.'; }
  render();
}

}

  el.innerHTML = `<div class="scanbox"><video playsinline muted aria-hidden="true"></video><div class="aim" aria-hidden="true"></div></div>
    <div class="scanbar"><span class="eyebrow" style="color:var(--stone)">Point the camera at the barcode</span><div id="scan-msg" class="section"></div>
    <button class="btn ghost" data-act="closeScan">Cancel</button></div>`;

  const msg = el.querySelector('#scan-msg');
  const fallback = (text) => { stopCamera(); el.querySelector('.scanbox').hidden = true; msg.innerHTML = typedBarcodeForm(text); const i = el.querySelector('#bc-num'); if (i) i.focus(); };
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) { fallback('This browser can’t read barcodes with the camera. Type the number under the barcode instead.'); return; }
  try {
    const supported = await BarcodeDetector.getSupportedFormats();
    const formats = ['ean_13', 'ean_8', 'upc_a', 'upc_e'].filter((f) => supported.includes(f));
    const det = new BarcodeDetector(formats.length ? { formats } : undefined);
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    if (!document.getElementById('scanner')) { stopCamera(); return; }
    const video = el.querySelector('video');
    video.srcObject = scanStream; await video.play();
    msg.innerHTML = '<button type="button" class="linkbtn" data-act="typeBarcode" style="color:var(--lime-light);align-self:flex-start">Type the number instead</button>';
    const tick = async () => {
      if (!scanStream) return;
      try { const codes = await det.detect(video); if (codes.length) { const c = codes[0].rawValue; closeScan(); lookupBarcode(c); return; } } catch (e) {}
      scanTimer = setTimeout(tick, 200);
    };
    tick();
  } catch (e) {
    fallback('The camera isn’t available. Allow camera access for this app, or type the number under the barcode.');
  }
}

/* ===== Recent, favorites, saved meals ===== */
const entryKey = (f) => f.fkey || (f.kind === 'group' ? 'group:' : 'manual:') + f.name.toLowerCase();
function snap(f) {
  const s = { key: entryKey(f), fkey: f.fkey || '', name: f.name, brand: f.brand || '', portion: f.portion || '', kcal: f.kcal, grams: f.grams || 0 };
  if (f.kind === 'group') { s.kind = 'group'; s.items = f.items.map((x) => ({ ...x })); }
  return s;
}
function addEntry(s) {
  const e = { id: newId(), meal: S.meal, name: s.name, brand: s.brand || '', portion: s.portion || '', kcal: Math.round(s.kcal), fkey: s.fkey || '', grams: s.grams || 0 };
  if (s.kind === 'group') { e.kind = 'group'; e.items = s.items.map((x) => ({ name: x.name, brand: x.brand || '', portion: x.portion || '', kcal: Math.round(x.kcal), fkey: x.fkey || '', grams: x.grams || 0 })); }
  ensureDay(S.date).foods.push(e);
}
// A saved meal logs as one grouped line; tap it on Today to see what's in it
function mealAsEntry(m) {
  const total = m.items.reduce((s, x) => s + x.kcal, 0);
  return { kind: 'group', name: m.name, portion: m.items.length + ' item' + (m.items.length === 1 ? '' : 's'), kcal: total, items: m.items };
}
// Flatten grouped lines when saving a new meal from what's been logged
function flatItems(list) { return list.flatMap((f) => (f.kind === 'group' ? f.items.map((x) => snap(x)) : [snap(f)])); }
function isFav(key) { return S.data.favs.some((x) => x.key === key); }
function toggleFav(s) { if (isFav(s.key)) S.data.favs = S.data.favs.filter((x) => x.key !== s.key); else S.data.favs.unshift(s); saveData(); }
function recentFor(meal) {
  const map = new Map(), since = shift(todayKey(), -90);
  Object.keys(S.data.days).sort().forEach((k) => {
    if (k < since) return;
    S.data.days[k].foods.forEach((f) => {
      const key = entryKey(f);
      let r = map.get(key);
      if (!r) { r = { key, count: {}, last: '' }; map.set(key, r); }
      r.count[f.meal] = (r.count[f.meal] || 0) + 1; r.last = k; r.entry = f;
    });
  });
  const all = [...map.values()];
  const usual = all.filter((r) => r.count[meal]).sort((a, b) => (b.count[meal] - a.count[meal]) || (a.last < b.last ? 1 : -1)).slice(0, 8);
  const used = new Set(usual.map((r) => r.key));
  const other = all.filter((r) => !used.has(r.key)).sort((a, b) => (a.last < b.last ? 1 : -1)).slice(0, 12);
  return { usual, other };
}
function hasRecents() { return Object.values(S.data.days).some((d) => d.foods.length); }

  return `

      <div class="bars" role="img" aria-label="${esc(summary)}">${bars}</div>
      <div class="days">${days}</div>
      <div class="legend"><span><i class="sw"></i>Eaten</span><span><i class="sw line"></i>Budget (target + exercise)</span></div>
    </section>
    <section class="card chart" aria-labelledby="h2x">
      <div class="rowtop" style="justify-content:space-between"><h2 class="h2" id="h2x" style="color:var(--ink)">02 · Weight</h2><span class="muted">Weekly check-ins</span></div>
      <div class="weightrow"><span class="num">${cur.toFixed(1)}</span><span class="label" style="font-size:13px">lb</span>${wChange}</div>
      ${wChart}
      <form class="inline-form" data-form="weight">
        <label class="sr" for="w-lb">Today’s weight in pounds</label>
        <input id="w-lb" name="lb" type="number" inputmode="decimal" step="0.1" min="70" max="600" placeholder="${todayW ? 'Update today: ' + todayW.lb : 'Today’s weight (lb)'}" required>
        <button class="btn ghost" type="submit" style="min-height:48px">Log weight</button>
      </form>
      <p class="muted" style="margin:0">Each check-in updates your daily target.</p>
    </section>
  </main>`;
}

function viewSettings() {
  const p = S.data.profile;
  const lb = weightOn(todayKey());
  const g = GOALS.find((x) => x[0] === p.goal);
  return `
  <header class="top gutter"><div class="titles"><span class="eyebrow">Your app · Stored on this phone</span><h1 class="h1">Settings</h1></div></header>
  <main class="stack gutter">
    <section class="card" aria-label="Profile">
      <div class="card-head"><h2>Profile</h2><span class="num">${fmt(targetFor(p, lb))} cal</span></div>
      <div class="item"><div class="what"><span class="name">${p.age} years · ${Math.floor(p.heightIn / 12)}′${p.heightIn % 12}″ · ${lb.toFixed(1)} lb</span><span class="muted">${LEVELS[p.activity].name} · Goal: ${g[1].toLowerCase()}</span></div></div>
      <button class="addlink" data-act="editProfile">Edit profile</button>
    </section>
    <section class="card" aria-label="Food search key">
      <div class="card-head"><h2>Food search key</h2><span class="label" style="color:${S.data.apiKey ? 'var(--lime-text)' : 'var(--slate)'}">${S.data.apiKey ? 'Saved' : 'Not set'}</span></div>
      ${S.data.apiKey
        ? `<div class="item"><div class="what"><span class="name">USDA key ending in ${esc(S.data.apiKey.slice(-4))}</span><span class="muted">Stored only on this phone.</span></div></div>
           <button class="addlink" data-act="removeKey">Remove key</button>`
        : `<form class="section" data-form="key" style="padding:16px">
             <label class="field" for="k-key">Paste your USDA FoodData Central key<input id="k-key" name="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
             <button class="btn" type="submit">Save key</button>
             <p class="muted" style="margin:0">Free from <a href="https://fdc.nal.usda.gov/api-key-signup" target="_blank" rel="noopener">fdc.nal.usda.gov</a>. Stored only on this phone, never in the app’s code.</p>
           </form>`}
    </section>
    <section class="card" aria-label="Coming next">
      <div class="card-head"><h2>Coming next</h2></div>
      <div class="item"><div class="what"><span class="name">Backup &amp; restore</span><span class="muted">Save everything to one file, and load it on a new phone.</span></div></div>
    </section>
    <section class="card" aria-label="About the food data">
      <div class="card-head"><h2>Food data</h2></div>
      <div class="item"><div class="what"><span class="muted">Everyday and brand foods: USDA FoodData Central (public domain). Barcodes: Open Food Facts, available under the Open Database License.</span></div></div>
    </section>
    <section class="section">
      ${S.confirm === 'erase'
        ? `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px" role="alertdialog" aria-labelledby="erase-q">
             <p id="erase-q" style="margin:0;font-weight:600">Erase every meal, workout, weight and your profile from this phone? This can’t be undone.</p>
             <div class="btnrow"><button class="btn ghost" data-act="cancelConfirm">Keep my data</button><button class="btn danger" data-act="eraseAll">Erase all</button></div>
           </div>`
        : '<button class="btn ghost" data-act="askErase">Erase all data</button>'}
    </section>
  </main>`;
}

function nav() {
  const t = (v, l) => `<button data-act="tab" data-v="${v}"${S.view === v ? ' aria-current="page"' : ''}>${l}</button>`;
  return `<nav class="tabs" aria-label="Main"><div class="inner">${t('today', 'Today')}${t('history', 'History')}${t('settings', 'Settings')}</div></nav>`;
}

/* ===== Render ===== */
const app = document.getElementById('app');
function render(focusSel) {
  if (S.view === 'setup' && !S.draft) startDraft();
  const views = { setup: viewSetup, today: viewToday, addFood: viewAddFood, addEx: viewAddEx, history: viewHistory, settings: viewSettings };
  const withNav = ['today', 'history', 'settings'].includes(S.view);
  app.className = 'app' + (withNav ? '' : ' no-nav');
  app.innerHTML = views[S.view]() + (withNav ? nav() : '');
  if (focusSel) { const el = app.querySelector(focusSel); if (el) el.focus(); }
}
function go(view, focusSel) { closeScan(); S.view = view; S.msg = ''; S.confirm = null; render(focusSel); window.scrollTo(0, 0); }
function startDraft() {
  const p = S.data.profile;
  S.draft = p ? { ...p, weightLb: weightOn(todayKey()) } : { age: 40, sex: 'm', heightIn: 70, weightLb: 180, activity: 1, goal: 'maintain' };
}

/* ===== Sample week ===== */
function sampleWeek() {
  const F = {
    oat: ['Oatmeal, cooked', '1 cup', 166], banana: ['Banana', '1 medium', 105], coffee: ['Coffee, black', '12 fl oz', 2],
    yogurt: ['Greek yogurt, plain nonfat', '170 g', 100], almonds: ['Almonds', '1 oz', 164], chicken: ['Chicken breast, grilled', '4 oz', 187],
    rice: ['Brown rice, cooked', '1 cup', 218], broccoli: ['Broccoli, steamed', '1 cup', 55], salmon: ['Salmon, baked', '6 oz', 350],
    pasta: ['Spaghetti, cooked', '1.5 cups', 330], sauce: ['Marinara sauce', '1/2 cup', 70], sandwich: ['Turkey sandwich', '1 sandwich', 380],
    apple: ['Apple', '1 medium', 95], pb: ['Peanut butter', '2 tbsp', 190], eggs: ['Eggs, scrambled', '2 large', 182],
    toast: ['Whole-wheat toast', '1 slice', 80], salad: ['Garden salad with dressing', '1 bowl', 150], potato: ['Sweet potato, baked', '1 medium', 103],
    pizza: ['Cheese pizza', '2 slices', 570]
  };
  const plans = [
    { b: ['oat', 'banana', 'coffee'], l: ['sandwich', 'apple'], d: ['salmon', 'rice', 'broccoli'], s: ['yogurt', 'almonds'], x: [['run-mod', 30]] },
    { b: ['eggs', 'toast', 'coffee'], l: ['chicken', 'rice', 'salad'], d: ['pasta', 'sauce', 'salad'], s: ['apple', 'pb'], x: [] },
    { b: ['oat', 'banana', 'coffee'], l: ['sandwich', 'yogurt'], d: ['chicken', 'potato', 'broccoli'], s: ['almonds'], x: [['run-easy', 30]] },
    { b: ['eggs', 'toast', 'coffee'], l: ['salad', 'chicken'], d: ['pizza', 'salad'], s: ['apple'], x: [] },
    { b: ['oat', 'banana', 'coffee'], l: ['sandwich', 'apple'], d: ['salmon', 'potato', 'broccoli'], s: ['yogurt', 'pb'], x: [['hoops', 45]] },
    { b: ['eggs', 'toast', 'coffee'], l: ['chicken', 'rice', 'broccoli'], d: ['pasta', 'sauce'], s: ['almonds', 'apple'], x: [['mow', 40]] },
    { b: ['oat', 'banana', 'coffee'], l: ['chicken', 'rice', 'broccoli'], d: [], s: ['yogurt', 'almonds'], x: [['run-mod', 30]] }
  ];
  const t0 = todayKey();
  const profile = { age: 40, sex: 'm', heightIn: 71, weightLb: 186.4, activity: 1, goal: 'lose' };
  const weights = [[-28, 186.4], [-21, 185.0], [-14, 184.2], [-7, 183.1], [0, 181.0]].map(([o, lb]) => ({ date: shift(t0, o), lb }));
  const data = normalize({ profile, days: {}, weights, sample: true, apiKey: S.data.apiKey || '' });
  const sn = (f) => ({ key: 'manual:' + F[f][0].toLowerCase(), fkey: '', name: F[f][0], brand: '', portion: F[f][1], kcal: F[f][2], grams: 0 });
  data.favs = ['yogurt', 'banana', 'almonds'].map(sn);
  data.meals = [
    { id: 'm1', name: 'Usual breakfast', items: ['oat', 'banana', 'coffee'].map(sn) },
    { id: 'm2', name: 'Post-run lunch', items: ['chicken', 'rice', 'broccoli'].map(sn) }
  ];
  S.data = data;
  plans.forEach((p, i) => {
    const k = shift(t0, i - 6);
    const foods = [];
    [['breakfast', p.b], ['lunch', p.l], ['dinner', p.d], ['snacks', p.s]].forEach(([meal, list]) => list.forEach((f) => foods.push({ id: newId(), meal, name: F[f][0], portion: F[f][1], kcal: F[f][2] })));
    const exercise = p.x.map(([aid, mins]) => { const a = ACTIVITIES.find((x) => x.id === aid); return { id: newId(), name: a.name, met: a.met, mins, kcal: burn(a.met, weightOn(k), mins) }; });
    data.days[k] = { foods, exercise };
  });
  return data;
}

/* ===== Events ===== */
function ensureDay(k) { if (!S.data.days[k]) S.data.days[k] = { foods: [], exercise: [] }; return S.data.days[k]; }
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case 'sex': S.draft.sex = v; render(); break;
    case 'level': S.draft.activity = Number(v); render(); break;
    case 'goal': S.draft.goal = v; render(); break;
    case 'sample': sampleWeek(); saveData(); S.draft = null; S.date = todayKey(); go('today'); break;
    case 'clearSample': S.data = emptyData(S.data.apiKey); saveData(); S.draft = null; go('setup'); break;
    case 'cancelEdit': S.editing = false; S.draft = null; go('settings'); break;
    case 'editProfile': S.editing = true; startDraft(); go('setup'); break;
    case 'tab': if (v === 'today') S.date = todayKey(); go(v); break;
    case 'prevDay': S.date = shift(S.date, -1); render(); break;
    case 'nextDay': if (S.date < todayKey()) { S.date = shift(S.date, 1); render(); } break;
    case 'goAddFood':
      S.meal = b.dataset.meal; S.pick = null; S.manual = false; S.saving = false; S.added = new Set();
      S.search = { q: '', status: 'idle', generic: [], branded: [], msg: '', scanned: '' };
      S.foodTab = hasRecents() ? 'recent' : 'search';
      go('addFood', S.foodTab === 'search' ? '#q' : null); break;
    case 'foodTab': S.foodTab = v; S.pick = null; S.saving = false; render(v === 'search' ? '#q' : null); break;
    case 'scan': startScan(); break;
    case 'closeScan': closeScan(); break;
    case 'typeBarcode': {
      stopCamera();
      const el = document.getElementById('scanner');
      if (el) { el.querySelector('.scanbox').hidden = true; el.querySelector('#scan-msg').innerHTML = typedBarcodeForm('Type the number printed under the barcode.'); el.querySelector('#bc-num').focus(); }
      break;
    }
    case 'openPick': {
      const food = findFood(b.dataset.k);
      if (!food) break;
      const same = S.pick && S.pick.food.fkey === food.fkey && S.pickIn === 'search';
      S.pick = same ? null : { food, u: 0, qty: 1 }; S.pickIn = 'search';
      refreshFoodArea();
      if (!same) { loadDetail(food); const q = app.querySelector('#p-qty'); if (q) q.focus(); }
      break;
    }
    case 'repick': {
      const s = S.rowMap.get(b.dataset.k), food = s && S.data.foods[s.fkey];
      if (!food) break;
      const same = S.pick && S.pickIn === 'list' && S.pick.food.fkey === food.fkey;
      S.pick = same ? null : { food, u: 0, qty: 1 }; S.pickIn = 'list';
      render(same ? null : '#p-qty'); break;
    }
    case 'addPick': {
      if (!S.pick || !(Number(S.pick.qty) > 0)) break;
      S.data.foods[S.pick.food.fkey] = S.pick.food;
      addEntry(pickSnap()); saveData(); S.pick = null; go('today'); break;
    }
    case 'favPick': {
      S.data.foods[S.pick.food.fkey] = S.pick.food;
      toggleFav(pickSnap());
      const on = isFav(S.pick.food.fkey);
      b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', on ? 'Remove from favorites' : 'Add to favorites'); b.innerHTML = star(on);
      break;
    }
    case 'fav': { const s = S.rowMap.get(b.dataset.k); if (s) { toggleFav(s); render(); } break; }
    case 'quickAdd': { const s = S.rowMap.get(b.dataset.k); if (s) { addEntry(s); S.added.add(s.key); saveData(); render(); } break; }
    case 'manual': S.manual = true; render('#f-name'); break;
    case 'logMeal': {
      const m = S.data.meals.find((x) => x.id === b.dataset.k);
      if (m) { addEntry(mealAsEntry(m)); S.added.add('meal:' + m.id); saveData(); render(); }
      break;
    }
    case 'delMeal': S.data.meals = S.data.meals.filter((x) => x.id !== b.dataset.k); saveData(); render(); break;
    case 'startSaveMeal': S.saving = true; render('#m-name'); break;
    case 'cancelSaveMeal': S.saving = false; render(); break;
    case 'showMore': S.search.more = true; renderResults(); break;
    case 'toggleGroup': if (S.openGroups.has(b.dataset.id)) S.openGroups.delete(b.dataset.id); else S.openGroups.add(b.dataset.id); render(); break;
    case 'removeKey': S.data.apiKey = ''; saveData(); render('#k-key'); break;
    case 'goAddEx': go('addEx'); break;
    case 'goToday': go('today'); break;
    case 'meal': S.meal = v; render('#f-name'); break;
    case 'delFood': { const d = day(S.date); d.foods = d.foods.filter((f) => f.id !== b.dataset.id); saveData(); render(); break; }
    case 'delEx': { const d = day(S.date); d.exercise = d.exercise.filter((e) => e.id !== b.dataset.id); saveData(); render(); break; }
    case 'pickEx': S.ex.idx = Number(v); render(); break;
    case 'mins': S.ex.mins = Math.min(300, Math.max(1, S.ex.mins + Number(v))); render(); break;
    case 'setMins': S.ex.mins = Number(v); render(); break;
    case 'addEx': {
      const a = ACTIVITIES[S.ex.idx];
      ensureDay(S.date).exercise.push({ id: newId(), name: a.name, met: a.met, mins: S.ex.mins, kcal: burn(a.met, weightOn(S.date), S.ex.mins) });
      saveData(); go('today'); break;
    }
    case 'askErase': S.confirm = 'erase'; render('[data-act="cancelConfirm"]'); break;
    case 'cancelConfirm': S.confirm = null; render(); break;
    case 'eraseAll': S.data = emptyData(); saveData(); S.draft = null; S.editing = false; go('setup'); break;
  }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'p-unit' && S.pick) {
    S.pick.u = Number(ev.target.value);
    const k = document.getElementById('p-kcal'); if (k) k.textContent = fmt(pickKcal(S.pick)) + ' cal';
  }
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'q') {
    S.search.q = ev.target.value;
    clearTimeout(searchTimer);
    const val = ev.target.value;
    searchTimer = setTimeout(() => runSearch(val), 450);
    return;
  }
  if (ev.target.id === 'p-qty' && S.pick) {
    S.pick.qty = Number(ev.target.value) || 0;
    const k = document.getElementById('p-kcal'); if (k) k.textContent = fmt(pickKcal(S.pick)) + ' cal';
    return;
  }
  if (S.view === 'addEx' && ev.target.id === 'x-mins') {
    const m = Math.round(Number(ev.target.value));
    if (m >= 1 && m <= 300) {
      S.ex.mins = m;
      const p = document.getElementById('burn-panel');
      if (p) p.innerHTML = burnPanel();
      app.querySelectorAll('.presets button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === m)));
    }
    return;
  }
  if (S.view !== 'setup' || !ev.target.form) return;
  const E = ev.target.form.elements;
  S.draft.age = Number(E['age'].value);
  S.draft.weightLb = Number(E['weightLb'].value);
  S.draft.heightIn = Number(E['ft'].value) * 12 + Number(E['in'].value);
  const panel = document.getElementById('target-panel');
  if (panel) panel.innerHTML = targetPanel();
});
document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const f = ev.target;
  if (f.dataset.form === 'setup') {
    if (!draftValid(S.draft)) { const p = document.getElementById('target-panel'); if (p) p.innerHTML = targetPanel(); f.querySelector('input:invalid, input')?.focus(); return; }
    const d = S.draft;
    const profile = { age: d.age, sex: d.sex, heightIn: d.heightIn, weightLb: d.weightLb, activity: d.activity, goal: d.goal };
    const t0 = todayKey();
    if (S.editing && S.data.profile) {
      S.data.profile = profile;
      if (Math.abs(weightOn(t0) - d.weightLb) > 0.01) logWeight(d.weightLb);
    } else {
      S.data = emptyData(); S.data.profile = profile; S.data.weights = [{ date: t0, lb: d.weightLb }];
    }
    S.editing = false; S.draft = null; saveData(); S.date = t0; go('today');
  } else if (f.dataset.form === 'food') {
    const E = f.elements;
    const name = E['food'].value.trim(), kcal = Number(E['kcal'].value);
    if (!name || E['kcal'].value === '' || !(kcal >= 0)) { S.msg = !name ? 'Add a food name.' : 'Add the calories (a number).'; render(!name ? '#f-name' : '#f-kcal'); return; }
    ensureDay(S.date).foods.push({ id: newId(), meal: S.meal, name, portion: E['portion'].value.trim(), kcal: Math.round(kcal) });
    saveData(); go('today');
  } else if (f.dataset.form === 'search') {
    clearTimeout(searchTimer);
    const q = f.querySelector('#q');
    runSearch(q.value); q.blur();
  } else if (f.dataset.form === 'barcode') {
    const code = f.elements['code'].value;
    closeScan(); lookupBarcode(code);
  } else if (f.dataset.form === 'saveMeal') {
    const name = f.elements['mname'].value.trim() || 'Saved meal';
    const items = flatItems(day(S.date).foods.filter((x) => x.meal === S.meal));
    if (items.length) S.data.meals.push({ id: newId(), name, items });
    S.saving = false; saveData(); render();
  } else if (f.dataset.form === 'key') {
    const key = f.elements['key'].value.trim();
    if (!key) { f.elements['key'].focus(); return; }
    S.data.apiKey = key; saveData(); render();
  } else if (f.dataset.form === 'weight') {
    const inp = f.elements['lb'];
    const lb = Number(inp.value);
    if (!(lb >= 70 && lb <= 600)) { inp.focus(); return; }
    logWeight(lb); saveData(); render();
  }
});
function logWeight(lb) {
  const t0 = todayKey();
  S.data.weights = S.data.weights.filter((w) => w.date !== t0).concat([{ date: t0, lb }]);
}

render();
</script>
</body>
</html>
